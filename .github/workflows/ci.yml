name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: PHP をインストール (差分テスト用)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends php-cli
      - run: go vet ./...
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: fuzz (no-panic, 60s)
        run: go test -run='^$' -fuzz=FuzzUnmarshalNoPanic -fuzztime=60s .
      - name: fuzz (round-trip, 60s)
        run: go test -run='^$' -fuzz=FuzzRoundTrip -fuzztime=60s .
      - name: bench (参考値)
        run: go test -run='^$' -bench . -benchtime=1s .
